---
- name: Cisco 스위치 설정 백업 및 Synology NAS 자동 전송
  hosts: all
  gather_facts: no

  vars:
    # NAS 접속 및 백업 저장 경로
    ansible_python_interpreter: /usr/bin/python3
    nas_ip: "10.5.11.8"
    nas_user: "admin"
    nas_pw: "rkdgksit1@"
    nas_backup_path: "/volume1/cisco_BK/2026_L3_Backup"

  tasks:
    - name: 실행 시점 타임스탬프 변수 생성 및 고정
      set_fact:
        run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      delegate_to: localhost
      run_once: true

    - name: 로컬 백업 저장 디렉터리 생성
      file:
        path: "/tmp/switch_backups"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Legacy OpenSSL Config 임시 생성
      ansible.builtin.copy:
        dest: "/tmp/openssl_legacy.cnf"
        content: |
          openssl_conf = openssl_init

          [openssl_init]
          providers = provider_sect

          [provider_sect]
          default = default_sect
          legacy = legacy_sect

          [default_sect]
          activate = 1

          [legacy_sect]
          activate = 1
      delegate_to: localhost
      run_once: true

    # SSH 세션 내부에서 terminal length 0 및 show running-config 실행
    - name: Cisco 스위치 Running Config 수집
      ansible.builtin.shell: |
        OPENSSL_CONF=/tmp/openssl_legacy.cnf OPENSSL_ENABLE_SHA1_SIGNATURES=1 python3 -c '
        import pexpect, sys

        ssh_cmd = (
            "ssh -p 22 -tt "
            "-o StrictHostKeyChecking=no "
            "-o UserKnownHostsFile=/dev/null "
            "-o KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1 "
            "-o HostKeyAlgorithms=+ssh-rsa,ssh-dss "
            "-o PubkeyAcceptedKeyTypes=+ssh-rsa,ssh-dss "
            "-o PubkeyAcceptedAlgorithms=+ssh-rsa,ssh-dss "
            "-o Ciphers=+aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc "
            "{{ hostvars[inventory_hostname].ansible_user | default(hostvars[inventory_hostname].ansible_ssh_user | default("admin")) }}@{{ ansible_host | default(inventory_hostname) }}"
        )

        child = pexpect.spawn(ssh_cmd, encoding="utf-8", timeout=40)
        
        # 1. SSH 비밀번호 입력
        idx = child.expect(["[Pp]assword:", pexpect.EOF, pexpect.TIMEOUT])
        if idx == 0:
            child.sendline("{{ hostvars[inventory_hostname].ansible_password | default(hostvars[inventory_hostname].ansible_ssh_pass | default("")) }}")
        
        # 2. 프롬프트 확인 및 enable 처리
        idx = child.expect([">", "#", pexpect.TIMEOUT])
        if idx == 0:
            child.sendline("enable")
            child.expect("[Pp]assword:")
            child.sendline("{{ hostvars[inventory_hostname].ansible_enable_pass | default(hostvars[inventory_hostname].ansible_password | default("")) }}")
            child.expect("#")
        
        # 3. 화면 끊김 방지(paging) 및 config 출력 명령
        child.sendline("terminal length 0")
        child.expect("#")
        child.sendline("show running-config")
        child.expect("#")
        
        # 4. 수집 결과만 출력
        print(child.before)
        child.sendline("exit")
        '
      delegate_to: localhost
      register: switch_config
      changed_when: false

    - name: 수집한 백업 파일 로컬 저장
      ansible.builtin.copy:
        content: "{{ switch_config.stdout }}"
        dest: "/tmp/switch_backups/{{ inventory_hostname }}_{{ run_timestamp }}.cfg"
      delegate_to: localhost

    - name: Synology NAS 지정 경로로 파일 자동 전송
      ansible.builtin.shell: |
        sshpass -p '{{ nas_pw }}' scp -O -P 22 \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          "/tmp/switch_backups/{{ inventory_hostname }}_{{ run_timestamp }}.cfg" \
          {{ nas_user }}@{{ nas_ip }}:{{ nas_backup_path }}/
      delegate_to: localhost
      throttle: 1       # <--- [추가] NAS로는 파일 전송을 한 번에 1건씩 순차 처리
      retries: 3        # <--- [추가] 순간적인 NAS 접속 거절 발생 시 3회 재시도
      delay: 2
      register: scp_result

    - name: NAS 전송 로그 확인
      ansible.builtin.debug:
        msg:
          - "STDOUT: {{ scp_result.stdout }}"
          - "STDERR: {{ scp_result.stderr }}"
          - "Return Code: {{ scp_result.rc }}"
      delegate_to: localhost

