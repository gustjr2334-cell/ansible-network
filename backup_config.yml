---
- name: Cisco 스위치 설정 백업 및 Synology NAS 자동 전송
  hosts: all
  gather_facts: no

  collections:
    - cisco.ios

  vars:
    ansible_python_interpreter: /usr/bin/python3
    nas_ip: "10.5.11.8"
    nas_user: "admin"
    nas_pw: "rkdgksit1@"
    nas_backup_path: "/volume1/cisco_BK/2026_L3_Backup"

  tasks:
    - name: 실행 시점 타임스탬프 변수 생성 및 고정
      set_fact:
        run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      delegate_to: localhost
      run_once: true

    - name: 로컬 백업 저장 디렉터리 생성
      file:
        path: "/tmp/switch_backups"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Running Config 수집 및 백업 파일 생성
      ios_config:
        backup: yes
        backup_options:
          filename: "{{ inventory_hostname }}_{{ run_timestamp }}.cfg"
          dir_path: "/tmp/switch_backups"
      register: backup_result

    # SCP 대신 SSH 인증 정보를 통한 직접 전송 처리 (sshpass 패키지 미설치 대비)
    - name: Synology NAS로 파일 자동 전송
      delegate_to: localhost
      ansible.builtin.shell: >
        sshpass -p '{{ nas_pw }}' scp -O -P 22
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        "/tmp/switch_backups/{{ inventory_hostname }}_{{ run_timestamp }}.cfg"
        {{ nas_user }}@{{ nas_ip }}:{{ nas_backup_path }}/
      register: scp_result
      failed_when: scp_result.rc != 0
