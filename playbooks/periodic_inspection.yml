---
- name: "[Step 1] 네트워크 장비 정밀 종합 점검"
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_ssh_extra_args: "-o KexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa"

  tasks:
    - name: 주요 정기점검 CLI 명령어 일괄 실행
      cisco.ios.ios_command:
        commands:
          - show version
          - show environment all
          - show processes cpu sort
          - show processes memory sort
          - show interface status err-disabled
          - show interface count error
          - show standby brief
          - show etherchannel summary
          - show spanning-tree summary
          - show logging
      register: check_out
      ignore_errors: true

    - name: 점검 결과 텍스트 데이터 파싱 및 이상 유무 판정
      ansible.builtin.set_fact:
        dev_ver: "{{ check_out.stdout[0] | default('') }}"
        dev_env: "{{ check_out.stdout[1] | default('') }}"
        dev_cpu: "{{ check_out.stdout[2] | default('') }}"
        dev_mem: "{{ check_out.stdout[3] | default('') }}"
        dev_err_int: "{{ check_out.stdout[4] | default('') }}"
        dev_cnt_err: "{{ check_out.stdout[5] | default('') }}"
        dev_hsrp: "{{ check_out.stdout[6] | default('') }}"
        dev_eth: "{{ check_out.stdout[7] | default('') }}"
        dev_stp: "{{ check_out.stdout[8] | default('') }}"
        dev_log: "{{ check_out.stdout[9] | default('') }}"

    - name: 장비별 종합 점검 결과 요약 구조체 생성
      ansible.builtin.set_fact:
        device_status:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          env_status: "{{ '점검필요' if ('FAIL' in dev_env or 'Faulty' in dev_env) else '정상' }}"
          err_int_status: "{{ '에러포트존재' if (dev_err_int | regex_search('(Gi|Fa|Te|Two|Fo|Ten)[0-9/]+')) else '정상' }}"
          eth_status: "{{ '점검필요' if ('(D)' in dev_eth or '(s)' in dev_eth) else '정상' }}"
          hsrp_status: "{{ '점검필요' if ('Init' in dev_hsrp) else '정상' }}"
          raw_env: "{{ dev_env }}"
          raw_cpu: "{{ dev_cpu.splitlines()[:5] | join('\n') }}"
          raw_mem: "{{ dev_mem.splitlines()[:5] | join('\n') }}"
          raw_err_int: "{{ dev_err_int }}"
          raw_cnt_err: "{{ dev_cnt_err }}"

    - name: AWX 컨트롤러(localhost)로 전 장비 데이터 집계
      ansible.builtin.set_fact:
        all_results: "{{ ansible_play_hosts | map('extract', hostvars, 'device_status') | list }}"
      run_once: true
      delegate_to: localhost

- name: "[Step 2] PDF 보고서 생성 및 메일 발송"
  hosts: localhost
  gather_facts: false
  vars:
    mail_host: "email.ecopro.co.kr"     # 사내 SMTP 서버 IP 또는 주소
    mail_port: 25                     # SMTP 포트
    mail_from: "jhs@ecopro.co.kr" # 보낼 사람 이메일
    mail_to: "jhs@ecopro.co.kr"      # 받을 사람 이메일

  tasks:
    - name: Jinja2 HTML 보고서 생성
      ansible.builtin.template:
        src: ../templates/inspection_report.j2
        dest: /tmp/inspection_report.html

    - name: WeasyPrint로 PDF 변환
      ansible.builtin.command:
        cmd: weasyprint /tmp/inspection_report.html /tmp/Periodic_Inspection_Report.pdf

    - name: PDF 첨부 메일 발송
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port }}"
        subject: "[정기점검] {{ lookup('pipe', 'date +%Y-%m-%d') }} 인프라 네트워크 장비 정밀 점검 보고서"
        body: "안녕하세요. AWX 자동화 시스템에서 생성된 네트워크 장비 종합 점검 보고서를 첨부합니다."
        from: "{{ mail_from }}"
        to: "{{ mail_to }}"
        attach:
          - /tmp/Periodic_Inspection_Report.pdf
