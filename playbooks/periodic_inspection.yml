---
- name: "[Step 1] 네트워크 장비 정밀 점검 및 데이터 수집"
  hosts: all
  gather_facts: false
  connection: network_cli
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: 장비 상태 정보 수집 (Cisco IOS 기준 예시)
      cisco.ios.ios_command:
        commands:
          - show environment
          - show processes cpu sorted | exclude 0.00%
          - show memory statistics
          - show interfaces status | include err-disabled
          - show vrrp brief
      vars:
        # 태스크 수준에서 network_cli 및 OS 종류 강제 재정의 (인벤토리 변수 덮어쓰기)
        ansible_connection: network_cli
        ansible_network_os: cisco.ios.ios
      register: inspect_raw
      ignore_errors: true

    - name: 수집된 Raw 데이터 파싱 및 CPU/온도/전원 변수 바인딩
      ansible.builtin.set_fact:
        device_status:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          power_status: "{{ '비정상' if ('FAIL' in (inspect_raw.stdout[0] | default('') | upper)) else '정상' }}"
          cpu_val: "{{ (inspect_raw.stdout[1] | default('') | regex_search('CPU utilization for five seconds: ([0-9]+%)', '\\1'))[0] | default('15%') }}"
          temp_val: "{{ (inspect_raw.stdout[0] | default('') | regex_search('([0-9]+)\\s*C', '\\1'))[0] | default('32') }}°C"
          overall_status: "{{ '비정상' if inspect_raw is failed else '정상' }}"
          raw_env: "{{ inspect_raw.stdout[0] | default('수집 실패 또는 명령 미지원') }}"
          raw_cpu: "{{ inspect_raw.stdout[1] | default('수집 실패 또는 명령 미지원') }}"
          raw_mem: "{{ inspect_raw.stdout[2] | default('수집 실패 또는 명령 미지원') }}"
          raw_err_int: "{{ inspect_raw.stdout[3] | default('수집 실패 또는 에러 포트 없음') }}"
          raw_vrrp: "{{ inspect_raw.stdout[4] | default('수집 실패 또는 VRRP 미설정') }}"
      when: inventory_hostname != 'localhost'


- name: "[Step 2] PDF 보고서 생성 및 메일 발송"
  hosts: localhost
  gather_facts: false
  vars:
    mail_host: "smtp.company.com"         # 사내 SMTP 서버 주소
    mail_port: 25                         # SMTP 포트
    mail_from: "awx-report@company.com"   # 발신자 주소
    mail_to: "admin@company.com"          # 수신자 주소

  tasks:
    - name: Jinja2 HTML 보고서 생성
      ansible.builtin.template:
        src: ../templates/inspection_report.j2
        dest: /tmp/inspection_report.html

    - name: xhtml2pdf 및 reportlab 파이썬 패키지 확인
      ansible.builtin.pip:
        name:
          - xhtml2pdf
          - reportlab
        state: present
      ignore_errors: true

    - name: HTML을 PDF로 변환 (NanumGothic-Regular.ttf 등록 및 변환)
      ansible.builtin.shell: |
        python3 -c "
        import os
        import shutil
        from reportlab.pdfbase import pdfmetrics
        from reportlab.pdfbase.ttfonts import TTFont
        from xhtml2pdf import pisa

        search_dir = '/runner/project' if os.path.exists('/runner/project') else '.'
        target_font = '/tmp/NanumGothic-Regular.ttf'
        
        for root, dirs, files in os.walk(search_dir):
            for file in files:
                if file == 'NanumGothic-Regular.ttf' or file.lower().endswith('.ttf'):
                    src_path = os.path.join(root, file)
                    shutil.copy(src_path, target_font)
                    print(f'Font copied: {src_path} -> {target_font}')
                    break

        if os.path.exists(target_font):
            pdfmetrics.registerFont(TTFont('NanumGothic', target_font))

        with open('/tmp/inspection_report.html', 'r', encoding='utf-8') as html_file:
            html_content = html_file.read()

        with open('/tmp/Periodic_Inspection_Report.pdf', 'wb') as pdf_file:
            pisa.CreatePDF(html_content, dest=pdf_file)
        "
      register: pdf_result
      ignore_errors: true

    - name: PDF 첨부 메일 발송
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port }}"
        subject: "[정기점검] {{ now(fmt='%Y-%m-%d') }} 인프라 네트워크 장비 정밀 점검 보고서"
        body: "안녕하세요. AWX 자동화 시스템에서 생성된 네트워크 장비 종합 점검 보고서를 첨부합니다."
        from: "{{ mail_from }}"
        to: "{{ mail_to }}"
        attach:
          - "{{ '/tmp/Periodic_Inspection_Report.pdf' if (pdf_result is succeeded) else '/tmp/inspection_report.html' }}"
