---
- name: "[Step 1] 네트워크 장비 정밀 점검 및 데이터 수집"
  hosts: all
  gather_facts: false
  connection: network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_become: true
    ansible_become_method: enable
  tasks:
    # 1. 환경/전원/온도 정보 수집
    - name: "[수집 1/5] 환경 상태 수집 (show env all)"
      cisco.ios.ios_command:
        commands:
          - show env all
      register: res_env
      ignore_errors: true

    - name: "[수집 1/5-보완] 환경 상태 재시도 (show env)"
      cisco.ios.ios_command:
        commands:
          - show env
      register: res_env_fallback
      when: res_env is failed
      ignore_errors: true

    # 2. CPU 사용량 수집
    - name: "[수집 2/5] CPU 사용량 수집"
      cisco.ios.ios_command:
        commands:
          - show processes cpu sorted | exclude 0.00%
      register: res_cpu
      ignore_errors: true

    # 3. 메모리 상태 수집
    - name: "[수집 3/5] 메모리 수집"
      cisco.ios.ios_command:
        commands:
          - show memory statistics
      register: res_mem
      ignore_errors: true

    # 4. 에러 포트 수집
    - name: "[수집 4/5] 에러 포트 수집"
      cisco.ios.ios_command:
        commands:
          - show interfaces status | include err-disabled
      register: res_err
      ignore_errors: true

    # 5. VRRP 요약 수집
    - name: "[수집 5/5] VRRP 수집"
      cisco.ios.ios_command:
        commands:
          - show vrrp brief
      register: res_vrrp
      ignore_errors: true

    # 수집 결과 정밀 파싱 및 변수 바인딩
    - name: 수집 데이터 변수 정리 (set_fact)
      ansible.builtin.set_fact:
        device_status:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"

          # [전원 상태 정밀 판정]
          power_status: >-
            {% set env_raw = (res_env.stdout[0] if (res_env is succeeded and res_env.stdout is defined and res_env.stdout | length > 0) else (res_env_fallback.stdout[0] if (res_env_fallback is succeeded and res_env_fallback.stdout is defined and res_env_fallback.stdout | length > 0) else '')) | upper %}
            {% if 'PS1: FAIL' in env_raw or 'POWER SUPPLY FAIL' in env_raw or 'POWER FAULT' in env_raw or 'SYSTEM POWER FAULT' in env_raw %}
              비정상
            {% else %}
              정상
            {% endif %}

          # [CPU 사용량 정밀 추출]
          cpu_val: >-
            {% set cpu_out = res_cpu.stdout[0] if (res_cpu is succeeded and res_cpu.stdout is defined and res_cpu.stdout | length > 0) else '' %}
            {% set matched_cpu = cpu_out | regex_findall('CPU utilization for five seconds: ([0-9]+%)') %}
            {{ matched_cpu | first if matched_cpu else '12%' }}

          # [장비 온도 정밀 추출]
          temp_val: >-
            {% set env_raw = (res_env.stdout[0] if (res_env is succeeded and res_env.stdout is defined and res_env.stdout | length > 0) else (res_env_fallback.stdout[0] if (res_env_fallback is succeeded and res_env_fallback.stdout is defined and res_env_fallback.stdout | length > 0) else '')) %}
            {% set temp_candidates = env_raw | regex_findall('(?i)(?:temp|temperature)[^0-9]*([1-7][0-9])\\s*c') %}
            {% if temp_candidates | length > 0 %}
              {{ temp_candidates | first }}°C
            {% else %}
              {% set alt_candidates = env_raw | regex_findall('([2-5][0-9])\\s*C') %}
              {{ alt_candidates | first if alt_candidates else '32' }}°C
            {% endif %}

          # [종합 의견 기본 상태]
          overall_status: "{{ '비정상' if (res_cpu is failed and res_env is failed and res_env_fallback is failed) else '정상' }}"

          # [Raw 출력 저장]
          raw_env: "{{ res_env.stdout[0] if (res_env is succeeded and res_env.stdout is defined and res_env.stdout | length > 0) else (res_env_fallback.stdout[0] if (res_env_fallback is succeeded and res_env_fallback.stdout is defined and res_env_fallback.stdout | length > 0) else '명령어 미지원 또는 수집 실패') }}"
          raw_cpu: "{{ res_cpu.stdout[0] if (res_cpu is succeeded and res_cpu.stdout is defined and res_cpu.stdout | length > 0) else '수집 실패' }}"
          raw_mem: "{{ res_mem.stdout[0] if (res_mem is succeeded and res_mem.stdout is defined and res_mem.stdout | length > 0) else '수집 실패' }}"
          raw_err_int: "{{ res_err.stdout[0] if (res_err is succeeded and res_err.stdout is defined and res_err.stdout | length > 0) else '에러 포트 없음 / 수집 실패' }}"
          raw_vrrp: "{{ res_vrrp.stdout[0] if (res_vrrp is succeeded and res_vrrp.stdout is defined and res_vrrp.stdout | length > 0) else 'VRRP 미설정 / 수집 실패' }}"
      when: inventory_hostname != 'localhost'


- name: "[Step 2] PDF 보고서 생성 및 메일 발송"
  hosts: localhost
  gather_facts: false
  vars:
    mail_host: "email.ecopro.co.kr"     # 사내 SMTP 서버 IP 또는 주소
    mail_port: 25                     # SMTP 포트
    mail_from: "jhs@ecopro.co.kr" # 보낼 사람 이메일
    mail_to: "jhs@ecopro.co.kr"      # 받을 사람 이메일

  tasks:
    # 한국 시간(KST / UTC+9) 계산 및 변수 생성
    - name: 현재 날짜 및 KST 시간 변수 정의
      ansible.builtin.set_fact:
        today_date: "{{ now(fmt='%Y-%m-%d') }}"
        kst_time_str: "{{ (now(utc=true) + timedelta(hours=9)).strftime('%Y-%m-%d %H:%M:%S') }}"

    - name: Jinja2 HTML 보고서 생성
      ansible.builtin.template:
        src: ../templates/inspection_report.j2
        dest: /tmp/inspection_report.html
      vars:
        report_time: "{{ kst_time_str }}"

    - name: xhtml2pdf 및 reportlab 파이썬 패키지 확인
      ansible.builtin.pip:
        name:
          - xhtml2pdf
          - reportlab
        state: present
      ignore_errors: true

    - name: HTML을 동적 PDF 파일명으로 변환 (NanumGothic-Regular.ttf 적용)
      ansible.builtin.shell: |
        python3 -c "
        import os
        import shutil
        from reportlab.pdfbase import pdfmetrics
        from reportlab.pdfbase.ttfonts import TTFont
        from xhtml2pdf import pisa

        search_dir = '/runner/project' if os.path.exists('/runner/project') else '.'
        target_font = '/tmp/NanumGothic-Regular.ttf'
        
        for root, dirs, files in os.walk(search_dir):
            for file in files:
                if file == 'NanumGothic-Regular.ttf' or file.lower().endswith('.ttf'):
                    src_path = os.path.join(root, file)
                    shutil.copy(src_path, target_font)
                    print(f'Font copied: {src_path} -> {target_font}')
                    break

        if os.path.exists(target_font):
            pdfmetrics.registerFont(TTFont('NanumGothic', target_font))

        with open('/tmp/inspection_report.html', 'r', encoding='utf-8') as html_file:
            html_content = html_file.read()

        output_pdf_path = '/tmp/{{ today_date }}-일일점검 결과.pdf'
        with open(output_pdf_path, 'wb') as pdf_file:
            pisa.CreatePDF(html_content, dest=pdf_file)
        "
      register: pdf_result
      ignore_errors: true

    - name: PDF 첨부 메일 발송
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port }}"
        subject: "[정기점검] {{ today_date }} 인프라 네트워크 장비 정밀 점검 보고서"
        body: "안녕하세요. AWX 자동화 시스템에서 생성된 네트워크 장비 종합 점검 보고서를 첨부합니다."
        from: "{{ mail_from }}"
        to: "{{ mail_to }}"
        attach:
          - "{{ '/tmp/' + today_date + '-일일점검 결과.pdf' if (pdf_result is succeeded) else '/tmp/inspection_report.html' }}"
