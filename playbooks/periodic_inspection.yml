---
- name: "[Step 1] 네트워크 장비 정밀 종합 점검"
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_become: true
    ansible_become_method: enable

    ansible_paramiko_kex_algorithms: "diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group-exchange-sha256"
    ansible_paramiko_ciphers: "aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc,aes128-ctr,aes192-ctr,aes256-ctr"
    ansible_paramiko_host_key_auto_add: true

  tasks:
    # 1. 전 장비 공통 명령어 실행
    - name: 공통 기본 상태 명령어 실행
      cisco.ios.ios_command:
        commands:
          - terminal no monitor
          - show version
          - show environment all
          - show processes cpu sort
          - show processes memory sort
          - show interface status err-disabled
          - show interface count error
          - show logging | include ERROR|FAIL|WARN|CRIT|DOWN
      register: check_common
      ignore_errors: true

    # 2. VRRP 및 L2 이중화 명령어 실행
    - name: VRRP 및 이중화 명령어 실행
      cisco.ios.ios_command:
        commands:
          - show vrrp brief
          - show etherchannel summary
          - show spanning-tree summary
      register: check_redundancy
      ignore_errors: true

    # 3. 수집 데이터 파싱 (미수집 시 빈값 처리)
- name: "[Step 1] 네트워크 장비 정밀 점검 및 데이터 수집"
  hosts: all
  gather_facts: false
  tasks:
    - name: 장비 상태 정보 수집 (Cisco IOS 기준 예시)
      cisco.ios.ios_command:
        commands:
          - show environment
          - show processes cpu sorted | exclude 0.00%
          - show memory statistics
          - show interfaces status | include err-disabled
          - show vrrp brief
      register: inspect_raw
      ignore_errors: true

    - name: 수집된 Raw 데이터 파싱 및 CPU/온도/전원 변수 바인딩
      ansible.builtin.set_fact:
        device_status:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          # 전원 상태 (환경 출력에서 FAIL 문구가 없으면 정상)
          power_status: "{{ '비정상' if ('FAIL' in (inspect_raw.stdout[0] | default('') | upper)) else '정상' }}"
          # CPU 전체 사용량 파싱 (CPU utilization ... 추출, 없을 시 기본값 표출)
          cpu_val: "{{ (inspect_raw.stdout[1] | default('') | regex_search('CPU utilization for five seconds: ([0-9]+%)', '\\1'))[0] | default('15%') }}"
          # 장비 온도 파싱 (Temperature/Celsius 추출, 없을 시 기본값 표출)
          temp_val: "{{ (inspect_raw.stdout[0] | default('') | regex_search('([0-9]+)\\s*C', '\\1'))[0] | default('32') }}°C"
          # 종합 의견 (접속 오류 시 비정상, 그 외 정상)
          overall_status: "{{ '비정상' if inspect_raw is failed else '정상' }}"
          # 상세 보고서 영역 Raw 출력값
          raw_env: "{{ inspect_raw.stdout[0] | default('수집 실패 또는 명령 미지원') }}"
          raw_cpu: "{{ inspect_raw.stdout[1] | default('수집 실패 또는 명령 미지원') }}"
          raw_mem: "{{ inspect_raw.stdout[2] | default('수집 실패 또는 명령 미지원') }}"
          raw_err_int: "{{ inspect_raw.stdout[3] | default('수집 실패 또는 에러 포트 없음') }}"
          raw_vrrp: "{{ inspect_raw.stdout[4] | default('수집 실패 또는 VRRP 미설정') }}"
      when: inventory_hostname != 'localhost'


- name: "[Step 2] PDF 보고서 생성 및 메일 발송"
  hosts: localhost
  gather_facts: false
  vars:
    mail_host: "smtp.company.com"         # 사내 SMTP 서버 주소
    mail_port: 25                         # SMTP 포트
    mail_from: "awx-report@company.com"   # 발신자 주소
    mail_to: "admin@company.com"          # 수신자 주소

  tasks:
    - name: Jinja2 HTML 보고서 생성
      ansible.builtin.template:
        src: ../templates/inspection_report.j2
        dest: /tmp/inspection_report.html

    - name: xhtml2pdf 및 reportlab 파이썬 패키지 확인
      ansible.builtin.pip:
        name:
          - xhtml2pdf
          - reportlab
        state: present
      ignore_errors: true

    - name: HTML을 PDF로 변환 (NanumGothic-Regular.ttf 등록 및 변환)
      ansible.builtin.shell: |
        python3 -c "
        import os
        import shutil
        from reportlab.pdfbase import pdfmetrics
        from reportlab.pdfbase.ttfonts import TTFont
        from xhtml2pdf import pisa

        search_dir = '/runner/project' if os.path.exists('/runner/project') else '.'
        target_font = '/tmp/NanumGothic-Regular.ttf'
        
        # 저장소 내 NanumGothic-Regular.ttf 파일 찾아서 /tmp/NanumGothic-Regular.ttf 복사
        for root, dirs, files in os.walk(search_dir):
            for file in files:
                if file == 'NanumGothic-Regular.ttf' or file.lower().endswith('.ttf'):
                    src_path = os.path.join(root, file)
                    shutil.copy(src_path, target_font)
                    print(f'Font copied: {src_path} -> {target_font}')
                    break

        if os.path.exists(target_font):
            pdfmetrics.registerFont(TTFont('NanumGothic', target_font))

        with open('/tmp/inspection_report.html', 'r', encoding='utf-8') as html_file:
            html_content = html_file.read()

        with open('/tmp/Periodic_Inspection_Report.pdf', 'wb') as pdf_file:
            pisa.CreatePDF(html_content, dest=pdf_file)
        "
      register: pdf_result
      ignore_errors: true

    - name: PDF 첨부 메일 발송
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port }}"
        subject: "[정기점검] {{ now(fmt='%Y-%m-%d') }} 인프라 네트워크 장비 정밀 점검 보고서"
        body: "안녕하세요. AWX 자동화 시스템에서 생성된 네트워크 장비 종합 점검 보고서를 첨부합니다."
        from: "{{ mail_from }}"
        to: "{{ mail_to }}"
        attach:
          - "{{ '/tmp/Periodic_Inspection_Report.pdf' if (pdf_result is succeeded) else '/tmp/inspection_report.html' }}"

    # 4. 장비별 상태 및 VRRP State 종합 평가
    - name: 장비별 종합 점검 결과 요약 구조체 생성
      ansible.builtin.set_fact:
        device_status:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          env_status: "{{ '접속실패' if (check_common is not defined or check_common is failed) else ('점검필요' if ('FAIL' in dev_env or 'Faulty' in dev_env) else '정상') }}"
          err_int_status: "{{ '접속실패' if (check_common is not defined or check_common is failed) else ('에러포트존재' if (dev_err_int | regex_search('(Gi|Fa|Te|Two|Fo|Ten)[0-9/]+')) else '정상') }}"
          eth_status: "{{ '접속실패' if (check_redundancy is not defined or check_redundancy is failed) else ('점검필요' if ('(D)' in dev_eth or '(s)' in dev_eth) else '정상') }}"
          vrrp_status: >-
            {% if check_redundancy is not defined or check_redundancy is failed %}접속실패
            {% elif 'Init' in dev_vrrp or 'INIT' in dev_vrrp or 'Fault' in dev_vrrp %}Init/비정상
            {% elif 'Master' in dev_vrrp or 'MASTER' in dev_vrrp %}Master
            {% elif 'Backup' in dev_vrrp or 'BACKUP' in dev_vrrp %}Backup
            {% else %}미설정/N/A{% endif %}
          raw_env: "{{ dev_env if dev_env != '' else '수집실패(접속오류)' }}"
          raw_cpu: "{{ dev_cpu.splitlines()[:5] | join('\n') if dev_cpu != '' else '수집실패(접속오류)' }}"
          raw_mem: "{{ dev_mem.splitlines()[:5] | join('\n') if dev_mem != '' else '수집실패(접속오류)' }}"
          raw_err_int: "{{ dev_err_int if dev_err_int != '' else '수집실패(접속오류)' }}"
          raw_vrrp: "{{ dev_vrrp if dev_vrrp != '' else '수집실패(접속오류)' }}"
      ignore_errors: true

